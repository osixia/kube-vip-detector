apiVersion: v1
kind: Namespace
metadata:
  name: kube-network-detector
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-network-detector
  namespace: kube-network-detector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-network-detector
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-network-detector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-network-detector
subjects:
  - kind: ServiceAccount
    name: kube-network-detector
    namespace: kube-network-detector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-network-detector-leases
  namespace: kube-network-detector
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-network-detector-leases
  namespace: kube-network-detector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-network-detector-leases
subjects:
  - kind: ServiceAccount
    name: kube-network-detector
    namespace: kube-network-detector
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-network-detector
  namespace: kube-network-detector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-network-detector
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-network-detector
    spec:
      serviceAccountName: kube-network-detector
      nodeSelector:
        kubernetes.io/os: linux
      # Respond on control-plane nodes as well as workers.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-network-detector
          image: osixia/kube-network-detector
          imagePullPolicy: IfNotPresent
          args:
            - --vips=203.0.113.10,198.51.100.20
            - --vip-label-prefix=kube-network-detector/
            - --peers=database=10.0.0.20:5432
            - --peer-label-prefix=kube-network-detector/peer-
            - --port=9876
            - --log-level=info
            - --log-format=console
            - --dry-run=false
          env:
            - name: KUBE_NETWORK_DETECTOR_KEY
              valueFrom:
                secretKeyRef:
                  name: kube-network-detector-auth
                  key: hmac-key
            - name: KUBE_NETWORK_DETECTOR_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KUBE_NETWORK_DETECTOR_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KUBE_NETWORK_DETECTOR_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          ports:
            - name: probe
              containerPort: 9876
              hostPort: 9876
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: probe
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: probe
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
