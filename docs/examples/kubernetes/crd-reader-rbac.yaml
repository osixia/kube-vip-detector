# Additional permissions for the existing detector ServiceAccount.
# For custom deployments: install both CRDs and apply this RBAC before starting.
# The combined DaemonSet example already includes these reader permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-network-detector-crd-reader
rules:
  - apiGroups: [network.osixia.net]
    resources: [vips, peers]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-network-detector-crd-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-network-detector-crd-reader
subjects:
  - kind: ServiceAccount
    name: kube-network-detector
    namespace: kube-network-detector
