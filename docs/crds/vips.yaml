apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vips.network.osixia.net
spec:
  group: network.osixia.net
  scope: Namespaced
  names:
    kind: VIP
    plural: vips
    singular: vip
    shortNames: [nvip]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Address
          type: string
          jsonPath: .spec.address
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [address]
              properties:
                address:
                  type: string
                  minLength: 1
                  maxLength: 45
                  description: Canonical unicast IPv4 or IPv6 VIP to observe; no CIDR or brackets.
                  x-kubernetes-validations:
                    - rule: isIP(self)
                      message: address must be an IPv4 or IPv6 address
