apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: peers.network.osixia.net
spec:
  group: network.osixia.net
  scope: Namespaced
  names:
    kind: Peer
    plural: peers
    singular: peer
    shortNames: [npeer]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Address
          type: string
          jsonPath: .spec.address
        - name: Port
          type: integer
          jsonPath: .spec.port
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [address, port]
              properties:
                address:
                  type: string
                  minLength: 1
                  maxLength: 45
                  description: Unicast IPv4 or IPv6 TCP endpoint; no CIDR or brackets.
                  x-kubernetes-validations:
                    - rule: isIP(self)
                      message: address must be an IPv4 or IPv6 address
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
